<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>计算缓存</title>
  <link rel="icon" href="https://vuejs.org/logo.svg">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>

  <div id="app">
    <!-- 1.methods -->
    <h2>{{ getFullname() }}</h2>
    <h2>{{ getFullname() }}</h2>
    <h2>{{ getFullname() }}</h2>

    <!-- 2.computed -->
    <h2>{{ fullname }}</h2>
    <h2>{{ fullname }}</h2>
    <h2>{{ fullname }}</h2>

    <!-- 修改状态 -->
    <button @click="changeLastname">修改状态</button>
  </div>

  <script>
    const app = Vue.createApp({
      data() {
        return {
          firstName: "Klaus",
          lastName: "Wang"
        }
      },
      methods: {
        getFullname() {
          console.log("-----getFullname-----")
          return this.firstName + " " + this.lastName
        },
        changeLastname() {
          this.lastName = "Li"
        }
      },
      computed: {
        fullname() {
          console.log("-----computed fullname-----")
          return this.firstName + " " + this.lastName
        }
      }
    })

    app.mount("#app")
  </script>
</body>
</html>
